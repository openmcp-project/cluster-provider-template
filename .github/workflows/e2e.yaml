name: E2E Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-e2e:
    name: Test Cluster Provider
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install opencontrolplane-gen
        run: |
          go install github.com/openmcp-project/opencontrolplane-gen@v1.0.2

      - name: Run E2E test
        run: |
          task template:dev:e2e
